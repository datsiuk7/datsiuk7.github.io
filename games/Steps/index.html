<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кроки</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=1.0.0">
</head>
<body>
    <header class="game-header">
        <h1>Кроки</h1>
    </header>

    <div class="app">
        <div class="panel">
            <div class="topbar">
                <div class="status">
                    <div class="badge">Рівень: <span id="level">1</span></div>
                    <div class="badge">Субрівень: <span id="sublevel">1</span> / 5</div>
                    <div class="badge">Крок: <span id="progress">0</span> / <span id="total">0</span></div>
                    <div class="badge lives" id="lives">❤️❤️❤️</div>
                </div>
                <div class="controls">
                    <button class="btn-stop-resume" id="btn-stop-resume">Зупинити</button>
                    <button class="btn-exit" id="btn-exit">До рівнів</button>
                </div>
            </div>

            <div class="task-line" id="task">Запам'ятайте числа</div>

            <div class="stage" aria-live="polite">
                <div class="grid" id="grid"></div>
            </div>

            <div class="start-screen" id="start-screen">
                <div class="start-content">
                    <h3>Оберіть рівень</h3>
                    <div class="level-grid" id="level-grid">
                        <button class="level-btn" data-level="1"><span>1</span><small>Перший крок</small></button>
                        <button class="level-btn" data-level="2"><span>2</span><small>Допитливий</small></button>
                        <button class="level-btn" data-level="3"><span>3</span><small>Уважний</small></button>
                        <button class="level-btn" data-level="4"><span>4</span><small>Тактик</small></button>
                        <button class="level-btn" data-level="5"><span>5</span><small>Стратег</small></button>
                        <button class="level-btn" data-level="6"><span>6</span><small>Навігатор</small></button>
                        <button class="level-btn" data-level="7"><span>7</span><small>Архітектор</small></button>
                        <button class="level-btn" data-level="8"><span>8</span><small>Провидець</small></button>
                        <button class="level-btn" data-level="9"><span>9</span><small>Геній пам'яті</small></button>
                        <button class="level-btn" data-level="10"><span>10</span><small>Абсолютна пам'ять</small></button>
                    </div>
                    <div class="level-hint" id="level-hint"></div>
                </div>
            </div>

            <div class="overlay hidden" id="countdown">3</div>

            <div class="result" id="result">
                <div class="result-card">
                    <h2>Гру завершено</h2>
                    <div>Виконано кроків: <span id="correct">0</span> з <span id="total-result">0</span></div>
                    <div class="result-sub" id="result-sub">Раунд завершено</div>
                    <h3>Найкращі результати (рівень <span id="best-level">1</span>)</h3>
                    <ul id="best-list"></ul>
                    <button id="play-again">Грати знову</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/analytics.js"></script>
    <script src="./js/steps.js?v=1.0.0"></script>
</body>
</html>
