<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geo Switching</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <div class="panel">
            <div class="topbar">
                <div class="status">
                    <div class="badge">Time: <span id="time">90</span>s</div>
                    <div class="badge">Score: <span id="score">0</span></div>
                    <div class="badge lives" id="lives">❤️❤️❤️❤️❤️</div>
                </div>
            </div>
            <h1>Answer the question</h1>
            <div class="questions">
                <div class="question">
                    <p>Is the color blue?</p>
                    <div class="card" id="card-color"></div>
                </div>
                <div class="divider"></div>
                <div class="question">
                    <p>Is the figure square?</p>
                    <div class="card" id="card-shape"></div>
                </div>
            </div>
            <div class="actions">
                <button class="btn-no" id="btn-no">No</button>
                <button class="btn-yes" id="btn-yes">Yes</button>
            </div>
            <div class="overlay" id="countdown">3</div>
            <div class="result" id="result">
                <div class="result-card">
                    <h2>Game over</h2>
                    <div>Correct: <span id="correct">0</span> from <span id="total">0</span></div>
                    <h3>Your best scores:</h3>
                    <ul id="best-list"></ul>
                    <button id="play-again">Play again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/geoswitching.js"></script>
</body>
</html>
